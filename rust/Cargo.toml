[workspace]
members = [
    "crates/hambur-core",
    "crates/hambur-runtime",
    "crates/hambur-uniffi",
    "crates/hambur-db",
    "crates/hambur-llm",
    "crates/hambur-markdown",
    "crates/hambur-tools",
    "crates/hambur-sandbox",
    "crates/hambur-filestore",
    "crates/hambur-platform",
    "crates/hambur-config",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
hambur-core = { path = "crates/hambur-core" }
hambur-runtime = { path = "crates/hambur-runtime" }
hambur-db = { path = "crates/hambur-db" }
hambur-llm = { path = "crates/hambur-llm" }
hambur-markdown = { path = "crates/hambur-markdown" }
hambur-tools = { path = "crates/hambur-tools" }
hambur-sandbox = { path = "crates/hambur-sandbox" }
hambur-filestore = { path = "crates/hambur-filestore" }
hambur-platform = { path = "crates/hambur-platform" }
hambur-config = { path = "crates/hambur-config" }

tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1.19.0", features = ["v4"] }
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
uniffi = { version = "0.31.2", features = ["build"] }
mdstream = "0.3.0"
pulldown-cmark = "0.13"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
tar = "0.4.43"
flate2 = "1.0.35"
sha2 = "0.10.8"

[profile.release]
opt-level = "z"       # Optimize for size
lto = true            # Enable Link Time Optimization (LTO)
codegen-units = 1     # Maximize LTO optimization opportunities by using a single codegen unit
panic = "abort"       # Remove panic unwinding code
strip = true          # Strip all symbols and debug info from the binary
